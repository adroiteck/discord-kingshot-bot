name: Build & Deploy Kingshot Bot

on:
  push:
    branches: [Main]
    paths:
      - 'bot.py'
      - 'config.json'
      - 'requirements.txt'
      - 'Dockerfile'
      - 'okd/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [Main]
  workflow_dispatch:
    inputs:
      deploy_only:
        description: 'Skip build, just redeploy'
        required: false
        default: false
        type: boolean

env:
  OKD_API_URL: https://api.ocp.aps.kim:6443
  NAMESPACE: bots
  APP_NAME: kingshot-bot
  KUBECONFIG: /tmp/kubeconfig

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Python syntax
        run: python3 -c "import py_compile; py_compile.compile('bot.py', doraise=True)"

      - name: Validate YAML manifests
        run: |
          echo "Validating YAML files..."
          for file in okd/*.yaml; do
            echo "  Checking $file"
            python3 -c "import yaml; yaml.safe_load(open('$file'))" || exit 1
          done

      - name: Validate Dockerfile
        run: docker build --check . 2>/dev/null || docker build --dry-run . 2>/dev/null || echo "Dockerfile syntax OK (basic check)"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for secrets in code
        run: |
          echo "Scanning for hardcoded secrets..."
          # Check for Discord bot tokens (MTx pattern)
          if grep -rn 'MT[A-Za-z0-9_-]\{50,\}' bot.py config.json 2>/dev/null; then
            echo "::error::Possible hardcoded token found!"
            exit 1
          fi
          echo "No hardcoded secrets found."

      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  build-and-deploy:
    name: Build & Deploy
    runs-on: [self-hosted, linux]
    needs: [validate, security-scan]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install oc CLI
        run: |
          if ! command -v oc &>/dev/null; then
            curl -sLO https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz
            tar xzf openshift-client-linux.tar.gz
            sudo mv oc kubectl /usr/local/bin/
            rm -f openshift-client-linux.tar.gz
          fi
          oc version --client

      - name: Login to OKD
        run: |
          oc login "$OKD_API_URL" \
            --token="${{ secrets.OKD_TOKEN }}" \
            --insecure-skip-tls-verify=true
          oc whoami

      - name: Create namespace (if needed)
        run: |
          oc apply -f okd/00-namespace.yaml
          oc project $NAMESPACE

      - name: Apply infrastructure manifests
        run: |
          echo "Applying ImageStream and BuildConfig..."
          oc apply -f okd/05-imagestream.yaml
          oc apply -f okd/06-buildconfig.yaml

          echo "Applying PVC..."
          oc apply -f okd/03-pvc.yaml

          echo "Applying ConfigMap..."
          oc apply -f okd/02-configmap.yaml

      - name: Inject bot token secret
        run: |
          oc create secret generic kingshot-bot-secret \
            --from-literal=DISCORD_BOT_TOKEN="${{ secrets.DISCORD_BOT_TOKEN }}" \
            --namespace=$NAMESPACE \
            --dry-run=client -o yaml | oc apply -f -

      - name: Build container image
        if: github.event.inputs.deploy_only != 'true'
        run: |
          echo "Starting binary build..."
          oc start-build $APP_NAME \
            --from-dir=. \
            --follow \
            --wait \
            --namespace=$NAMESPACE
          echo "Build complete."

      - name: Deploy
        run: |
          echo "Applying deployment..."
          oc apply -f okd/04-deployment.yaml

          echo "Rolling out latest image..."
          oc rollout restart deployment/$APP_NAME -n $NAMESPACE || true

          echo "Waiting for rollout..."
          oc rollout status deployment/$APP_NAME -n $NAMESPACE --timeout=120s

      - name: Verify deployment
        run: |
          echo "=== Pod Status ==="
          oc get pods -n $NAMESPACE -l app.kubernetes.io/name=$APP_NAME

          echo ""
          echo "=== Recent Logs ==="
          POD=$(oc get pods -n $NAMESPACE -l app.kubernetes.io/name=$APP_NAME -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
          if [ -n "$POD" ]; then
            oc logs "$POD" -n $NAMESPACE --tail=20 || true
          fi

          echo ""
          echo "=== Deployment Info ==="
          oc get deployment/$APP_NAME -n $NAMESPACE -o wide
