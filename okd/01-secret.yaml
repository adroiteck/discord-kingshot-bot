---
# IMPORTANT: The bot token value below is a PLACEHOLDER.
# In production, this is managed via GitHub Actions CI/CD which substitutes
# the actual token from GitHub Secrets (DISCORD_BOT_TOKEN) during deployment.
# DO NOT commit real tokens to this file.
apiVersion: v1
kind: Secret
metadata:
  name: kingshot-bot-secret
  namespace: bots
  labels:
    app.kubernetes.io/name: kingshot-bot
    app.kubernetes.io/component: discord-bot
    app.kubernetes.io/managed-by: github-actions
type: Opaque
stringData:
  DISCORD_BOT_TOKEN: "PLACEHOLDER_REPLACED_BY_CI"
