---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kingshot-bot-data
  namespace: bots
  labels:
    app.kubernetes.io/name: kingshot-bot
    app.kubernetes.io/component: discord-bot
    app.kubernetes.io/managed-by: github-actions
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
